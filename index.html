    /* 動畫文字 */
    .dxd_beating > span {
      animation: bounce 2.6s cubic-bezier(0.5, 0, 1, .3) infinite alternate;
      display: inline-block;
      font-size: 50px;
      color: #666666;
      font-family: "宋体";
    }
    .dxd_beating > span:nth-of-type(1) { animation-delay: 0s; }
    .dxd_beating > span:nth-of-type(2) { animation-delay: 0.15s; }
    .dxd_beating > span:nth-of-type(3) { animation-delay: 0.3s; }
    .dxd_beating > span:nth-of-type(4) { animation-delay: 0.45s; }
    .dxd_beating > span:nth-of-type(5) { animation-delay: 0.6s; }
    .dxd_beating > span:nth-of-type(6) { animation-delay: 0.75s; }
    .dxd_beating > span:nth-of-type(7) { animation-delay: 0.9s; }
    .dxd_beating > span:nth-of-type(8) { animation-delay: 1.05s; }
    .dxd_beating > span:nth-of-type(9) { animation-delay: 1.2s; }
    .dxd_beating > span:nth-of-type(10) { animation-delay: 1.35s; }
    .dxd_beating > span:nth-of-type(11) { animation-delay: 1.5s; }
    .dxd_beating > span:nth-of-type(12) { animation-delay: 1.65s; }
    .dxd_beating > span:nth-of-type(13) { animation-delay: 1.8s; }
    .dxd_beating > span:nth-of-type(14) { animation-delay: 1.95s; }
    .dxd_beating > span:nth-of-type(15) { animation-delay: 2.1s; }
    .dxd_beating > span:nth-of-type(16) { animation-delay: 2.25s; }
    .dxd_beating > span:nth-of-type(17) { animation-delay: 2.4s; }
    .dxd_beating > span:nth-of-type(18) { animation-delay: 2.55s; }
    @keyframes bounce {
      0% { transform: translateY(0); text-shadow: 0 0 0.05em rgba(0, 0, 0, 0.7); }
      100% { transform: translateY(-0.1em); text-shadow: 0 .5em 0.05em rgba(0, 0, 0, 0.4); }
    }

    /* 連結按鈕樣式 */
    .link-btn {
      display: inline-block;
      margin: 12px 10px;
      padding: 14px 28px;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background-color: #0066cc;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.2s;
    }
    .link-btn:hover {
      background-color: #004d99;
      transform: translateY(-2px);
    }
    #linkArea {
      padding: 40px 20px;
      background: white;
      text-align: center;
      height: 100%;
      box-sizing: border-box;
    }
    #noLinkMessage {
      display: none;
      font-size: 22px;
      color: red;
      padding: 20px;
    }

    #clock1 {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 30;
      font-size: 24px;
      background-color: white;
      padding: 5px 10px;
    }
  </style>
</head>

<!-- 右下角時鐘 -->
<div id="clock1" style="top:830px;background-color:white;">

		<script src="reveal.min.js"></script>
    <style>
        #clock1 {
            position: fixed;
            bottom: 50px; /* Adjust as needed */
            left: 20px; /* Adjust as needed */
            z-index:30;
            font-size: 24px;
        }
    </style>

  <script type="text/javascript">
    function getTodayDate() {
      const today = new Date();
      const day = String(today.getDate()).padStart(2, '0');
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const year = today.getFullYear();
      return `${day}-${month}-${year}`;
    }

    const today = getTodayDate();
    const magazine = document.getElementById('magazine');
    const imageList = [];

    function checkImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(src);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function loadAllImages() {
      const extensions = ['jpeg', 'jpg', 'png', 'webp'];
      const maxNum = 200; // 最多支援到 _200
      const checkList = [];

      // 不帶編號的圖片
      extensions.forEach(ext => {
        checkList.push(`images/${today}.${ext}`);
      });

      // 帶編號的圖片 _01 ~ _200
      for (let i = 1; i <= maxNum; i++) {
        const num = String(i).padStart(2, '0');
        extensions.forEach(ext => {
          checkList.push(`images/${today}_${num}.${ext}`);
        });
      }

      const results = await Promise.all(checkList.map(src => checkImage(src)));

      results.forEach(src => {
        if (src) {
          imageList.push(src);
        }
      });

      imageList.forEach(src => {
        const page = document.createElement('div');
        page.style.backgroundImage = `url('${src}')`;
        magazine.appendChild(page);
      });

      $('#magazine').turn({
        display: 'single',
        acceleration: true,
        gradients: !$.isTouch,
        elevation: 50,
        when: {
          turned: function(e, page) {}
        }
      });
    }

    fetch('links.txt')
    .then(response => response.text())
    .then(text => {
    const lines = text.trim().split('\n');
    let foundLink = null;

    for (let line of lines) {
      const parts = line.trim().split(/\s+/);
      if (parts.length >= 2) {
        const date = parts[0];
        const url = parts.slice(1).join(' ');
        if (date === today) {
          foundLink = url;
          break;
        }
      }
    }

    const iframe = document.getElementById('todayVideo');
    const message = document.getElementById('noVideoMessage');

    if (foundLink) {
      // 自動把普通 YouTube 連結轉換成 embed 格式
      let embedUrl = foundLink;

      if (foundLink.includes('youtube.com/watch?v=')) {
        const videoId = foundLink.split('v=')[1].split('&')[0];
        embedUrl = `https://www.youtube.com/embed/${videoId}`;
      } else if (foundLink.includes('youtu.be/')) {
        const videoId = foundLink.split('youtu.be/')[1].split('?')[0];
        embedUrl = `https://www.youtube.com/embed/${videoId}`;
      } else if (foundLink.includes('youtube-nocookie.com/embed/')) {
        // 已經是 embed 格式，不需轉換
        embedUrl = foundLink;
      }

      iframe.src = embedUrl;
    } else {
      iframe.style.display = 'none';
      message.style.display = 'block';
    }
  })
  .catch(err => {
    console.error(err);
    document.getElementById('todayVideo').style.display = 'none';
    document.getElementById('noVideoMessage').style.display = 'block';
    document.getElementById('noVideoMessage').innerText = "無法讀取 links.txt";
  });

    loadAllImages();

    $(window).bind('keydown', function(e) {
      if (e.keyCode == 37)
        $('#magazine').turn('previous');
      else if (e.keyCode == 39)
        $('#magazine').turn('next');
    });

  // 右下角時鐘
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('clock1').innerText = `${hours}:${minutes}`;
  }
  setInterval(updateClock, 1000);
  updateClock();
</script>
